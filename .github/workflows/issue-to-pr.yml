name: issue-to-pr
on:
  issues:
    types: [labeled]

jobs:
  opencode:
    uses: ianloubser/code-monkey/.github/workflows/reusable-opencode.yml@main
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    with:
      agent: build
      timeout_minutes: 30
      allowed_actors: ianloubser
    secrets:
      OPENCODE_GH_PAT: ${{ secrets.OPENCODE_GH_PAT }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
